
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-flow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kunals30/task-flow-gitops.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: task-flow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
