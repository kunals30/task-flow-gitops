
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-flow
  namespace: task-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-flow
  template:
    metadata:
      labels:
        app: task-flow
    spec:
      imagePullSecrets:
        - name: nexus-registry-secret

      containers:
        - name: task-flow
          image: 10.0.1.212:8084/task-flow:4
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3001

          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: DATABASE_PATH
              value: /app/data/taskflow.db

          volumeMounts:
            - name: task-flow-data
              mountPath: /app/data

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: task-flow-data
          persistentVolumeClaim:
            claimName: task-flow-data
